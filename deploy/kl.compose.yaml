# docker compose demo: bundles and _kl/ in LocalStack S3, SQS change feed; the indexer publishes
# Lucene commits, query pods mirror them to local disk.
bundles_uri: s3://kl-knowledge/bundles
kl_uri: s3://kl-knowledge/_kl
s3:
  endpoint_url: http://localstack:4566
  region: us-east-1
  access_key_id: test
  secret_access_key: test
  allow_http: true
bundles:
  jira: {default_acl: [fund-ops]}
  confluence: {default_acl: []}
  legal: {default_acl: [legal], partition: restricted}
partitions:
  restricted:
    uri: s3://kl-knowledge/_kl/lucene/restricted
    required_groups: [legal]
embedding: {provider: onnx, model: Xenova/bge-small-en-v1.5, onnx_file: onnx/model_quantized.onnx, dim: 384}
rerank: {provider: onnx, model: Xenova/ms-marco-MiniLM-L-6-v2, onnx_file: onnx/model_quantized.onnx}
events: {sqs_queue_url: "http://localstack:4566/000000000000/kl-bundle-events", region: us-east-1}
cache: {dir: /cache, refresh_interval_s: 5}
auth: {mode: header}
